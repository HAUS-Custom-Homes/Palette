<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Palette</title>
    <style>
      :root { --bg: #12110f; --text: #ece7df; --muted: #9b9287; --accent: #c8a76a; --line: #322d26; }
      @media (prefers-color-scheme: light) { :root { --bg: #faf8f5; --text: #23201c; --muted: #6d655b; --accent: #8a6d33; --line: #e0d9cd; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 24px; text-align: center; }
      h1 { font: 20px Georgia, serif; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 14px; }
      p { color: var(--muted); max-width: 340px; margin: 0 auto 18px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--accent); color: #17140e; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <div>
      <h1>Palette</h1>
      <p>No signal, so the library is out of reach. You can still save photos; they stay on this phone and upload by themselves when you are back online.</p>
      <a href="/capture">Save photos</a>
    </div>
  </body>
</html>
